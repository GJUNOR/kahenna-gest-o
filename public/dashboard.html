<body>
<div class="dashboard">

        </div>

        <nav class="menu">
            <a href="/dashboard.html" class="active" aria-current="page">

            <a href="/leads.html">
                <i class="fa-solid fa-user-group"></i>
                <span>Pacientes</span>
            </a>

            <a href="/agenda.html">
                <i class="fa-solid fa-calendar-days"></i>

</div>

<i class="fa-solid fa-rotate"></i>
<span>Atualizar</span>
</button>
</div>
</header>
<main><section class="cards-grid routine-cards business-cards"><div class="card routine-card"><h3>Hoje</h3><strong id="agendamentosHoje">—</strong></div><article class="card routine-card revenue-card"><h3>Receita do dia</h3><strong id="receitaHoje">—</strong></article><article class="card routine-card revenue-card"><h3>Receita do mês</h3><strong id="receitaMes">—</strong></article></section><section class="widget"><div class="widget-header"><div><h2 class="widget-title">Sua agenda de hoje</h2></div><div class="routine-agenda-actions"><a href="/agenda.html" class="btn btn-primary">Abrir agenda</a><a href="/agenda.html?novo=1" class="btn btn-primary">Agendar paciente</a></div></div><p id="erroResumo" role="alert" hidden></p><div id="agendaResumo" class="summary-appointments"><p class="empty-state">Carregando os horários…</p></div></section><section class="widget tomorrow-agenda"><div class="widget-header"><div><h2 class="widget-title">Sua agenda de amanhã</h2></div><span class="tomorrow-count" id="amanhaContagem"></span></div><p id="erroAmanha" role="alert" hidden></p><div id="agendaAmanha" class="summary-appointments"><p class="empty-state">Carregando os horários…</p></div></section></main></div>
</div>
