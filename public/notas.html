<dialog id="notaDialog" class="nota-dialog" aria-labelledby="notaTitulo"><header><div><span class="crm-overline">COMPRAS DA CLÍNICA</span><h2 id="notaTitulo">Importar nota</h2></div><button type="button" class="crm-close" id="notaFechar" aria-label="Fechar importação">×</button></header><div class="nota-body"><label class="nota-upload">Selecionar XML, PDF ou foto<input type="file" id="notaArquivo" accept=".xml,application/xml,text/xml,application/pdf,image/jpeg,image/png"></label><p id="notaEstado" role="status"></p><form id="notaForm" hidden><div class="nota-fields"><label>Descrição da compra<input id="notaDescricao" maxlength="200" required></label><label>Fornecedor<input id="notaFornecedor" maxlength="120"></label><label>Valor pago (R$)<input id="notaTotal" type="number" step="0.01" min="0.01" max="1000000" inputmode="decimal" required></label><label>Data do pagamento<input id="notaData" type="date" required></label></div><div class="nota-items-heading"><h3>Conferir produtos</h3><button type="button" id="notaAdicionar" class="crm-button">Adicionar item</button></div><div id="notaItens"></div><p id="notaResumo"></p><details><summary>Texto identificado na nota</summary><pre id="notaTexto"></pre></details><label class="nota-confirmar"><input id="notaConferido" type="checkbox" required> Conferi os produtos, os valores e a data do pagamento.</label><footer><button type="submit" id="notaSalvar" class="crm-button crm-primary">Confirmar compra no Caixa</button></footer></form></div></dialog>
