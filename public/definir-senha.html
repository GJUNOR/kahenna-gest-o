<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar senha | Dra. Kahenna Vieira</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:#0b1120;color:#f8fafc}.card{width:min(440px,100%);padding:32px;border:1px solid #334155;border-radius:20px;background:#172033}.logo{width:58px;height:58px;border-radius:15px;object-fit:cover}h1{margin:18px 0 8px}p{color:#94a3b8;line-height:1.5}label{display:block;margin-top:18px;color:#cbd5e1;font-weight:700}input{width:100%;min-height:50px;margin-top:8px;padding:0 14px;border:1px solid #41516c;border-radius:11px;background:#101a2e;color:#fff;font:inherit}button{width:100%;min-height:50px;margin-top:22px;border:0;border-radius:11px;background:#3b82f6;color:#fff;font:inherit;font-weight:800;cursor:pointer}.message{margin-top:16px;color:#fca5a5}.success{color:#86efac}
