<dialog id="documentosDialog" class="documentos-dialog" aria-labelledby="documentosTitulo">
<header><h2 id="documentosTitulo">Documentos do paciente</h2><button type="button" id="documentosFechar" aria-label="Fechar documentos"><span aria-hidden="true">×</span></button></header>
<p id="documentosPaciente"></p>
<form id="documentosForm"><label for="documentosArquivo"><span class="documentos-upload-icon" aria-hidden="true"><i class="fa-regular fa-file-pdf"></i></span>Adicionar PDF escaneado</label><input id="documentosArquivo" type="file" accept=".pdf,application/pdf" required><button id="documentosEnviar" type="submit">Salvar para conferência</button></form>
<div class="documentos-abas" role="group" aria-label="Situação dos documentos"><button type="button" id="documentosPendentes" aria-pressed="true">Para conferir</button><button type="button" id="documentosArquivados" aria-pressed="false">Arquivados</button></div>
<p id="documentosStatus" role="status" aria-live="polite"></p><ul id="documentosLista" class="documentos-lista"></ul>
<section id="documentosConferencia" hidden aria-labelledby="documentosConferenciaTitulo">
<h3 id="documentosConferenciaTitulo">Conferir digitalização</h3><p id="documentosConferenciaNome"></p>
<div id="documentosVisualizador" aria-label="Página digitalizada"><canvas id="documentosPagina" role="img" aria-label="Página do PDF"></canvas></div>
<div class="documentos-paginacao"><button type="button" id="documentosAnterior">Página anterior</button><span id="documentosPaginaAtual" role="status" aria-live="polite"></span><label class="documentos-zoom">Ampliação <select id="documentosZoom"><option value="0.8" selected>80%</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><button type="button" id="documentosProxima">Próxima página</button></div>
<a id="documentosAbrir" target="_blank" rel="noopener">Abrir PDF em outra aba</a>
<div id="documentosConfirmacao"><label><input type="checkbox" id="documentosConferido"> Conferi todas as páginas: estão legíveis, completas, com as assinaturas necessárias e pertencem a este paciente.</label><button type="button" id="documentosFinalizar" disabled>Finalizar e arquivar</button></div>
</section>
</dialog>
