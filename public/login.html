<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Entrar | Dra. Kahenna Vieira</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
    <link rel="stylesheet" href="/login.css?v=2">
    <link rel="stylesheet" href="/kahenna-theme.css?v=31">
    <link rel="stylesheet" href="/mobile-refined.css?v=33">
<link rel="stylesheet" href="/crm-controls.css?v=2"></head>
<body class="login-screen">
    <main class="login-page">
        <svg class="login-linhas" aria-hidden="true" focusable="false" viewBox="0 0 1440 900" preserveAspectRatio="none" fill="none">
            <g stroke="#782639" stroke-width="1.05">
                <path opacity=".30" d="M-72 561C66 444 214 493 284 364S253 132 460-39"/>
                <path opacity=".23" d="M-56 520C86 410 196 466 254 340S231 110 406-34"/>
                <path opacity=".16" d="M-60 464C41 389 158 414 219 317S185 109 342-40"/>
                <path opacity=".11" d="M-40 389C78 325 134 360 173 272S147 100 281-38"/>
                <path opacity=".31" d="M879 957C1010 802 1151 901 1235 742S1272 482 1492 406"/>
                <path opacity=".23" d="M970 953C1060 834 1178 931 1261 778S1301 526 1490 457"/>
                <path opacity=".17" d="M1044 963C1126 878 1200 945 1290 821S1320 591 1488 510"/>
                <path opacity=".12" d="M1144 968C1238 895 1297 914 1340 823S1371 661 1490 606"/>
            </g>
        </svg>
        <section class="login-card" aria-label="Entrar no CRM Kahenna">
            <img class="login-logo" src="/logo.svg" alt="Dra. Kahenna Vieira">
            <form id="formLogin" novalidate>
                <label for="usuario">Usuário</label>
                <input id="usuario" name="usuario" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="254" required>
                <label for="senha">Senha</label>
                <input id="senha" name="senha" type="password" autocomplete="current-password" required>
                <p class="login-message" id="mensagemLogin" role="alert" aria-live="polite"></p>
                <button id="btnEntrar" type="submit">Entrar</button>
            </form>
        </section>
    </main>
    <script src="/login.js?v=34"></script>
</body>
</html>
